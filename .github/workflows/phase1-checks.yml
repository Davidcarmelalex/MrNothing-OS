name: Phase 1 checks
on:
  push:
    branches: [main, feat/phase1-agentic-phone]
  pull_request:
permissions:
  contents: read
jobs:
  python-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert checked-out source is the exact event head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install pinned cryptographic verification dependency
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-security-ci.txt"
      - name: Python security tests and static compilation
        run: bash scripts/phase1-preflight.sh
      - name: Android source-manifest security gate
        run: python3 scripts/android_manifest_gate.py android/app/src/main/AndroidManifest.xml
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert checked-out source is the exact event head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          cache: gradle
          cache-path: |
            ~/.gradle/caches
            ~/.gradle/distributions
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed | head -40
      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Download and checksum-verify Gradle 8.9
        run: |
          bash ../scripts/download_gradle_distribution.sh 8.9 "$HOME/.gradle/distributions/gradle-8.9-bin.zip"
          unzip -q "$HOME/.gradle/distributions/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
      - name: Build, unit test and compare repeat debug APK
        run: |
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon --dependency-verification=strict :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
          # Verify actual JUnit XML BEFORE clean deletes Gradle test reports.
          python3 ../scripts/qa023b1b2d3_unit_evidence.py app/build/test-results/testDebugUnitTest --summary "$RUNNER_TEMP/memory-vault-unit-evidence.json"
          cp -R app/build/test-results/testDebugUnitTest "$RUNNER_TEMP/memory-vault-junit-xml"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/first-build.apk"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon --dependency-verification=strict clean :app:assembleDebug
          cmp "$RUNNER_TEMP/first-build.apk" app/build/outputs/apk/debug/app-debug.apk
          echo "Repeat debug APK is byte-identical within this runner"
      - name: Publish exact-head JVM JUnit evidence (not hardware proof)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mrnothing-memoryvault-jvm-junit-evidence
          path: |
            ${{ runner.temp }}/memory-vault-unit-evidence.json
            ${{ runner.temp }}/memory-vault-junit-xml/TEST-*.xml
          if-no-files-found: error
          retention-days: 7
      - name: Negative control — reject modified Gradle dependency
        run: python3 ../scripts/ci005_dependency_verification_negative.py "$RUNNER_TEMP/gradle-8.9/bin/gradle"
      - name: Generate unsigned debug artifact metadata
        run: |
          python3 ../scripts/android_build_provenance.py --apk app/build/outputs/apk/debug/app-debug.apk --commit "$(git rev-parse HEAD)" --output app/build/outputs/apk/debug/provenance.json
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mrnothing-phase1-debug-not-for-release
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/provenance.json
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
