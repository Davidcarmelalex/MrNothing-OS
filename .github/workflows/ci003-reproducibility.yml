name: CI-003 unsigned Android reproducibility
on:
  push:
    branches: [feat/phase1-agentic-phone]
  pull_request:
    branches: [main, feat/phase1-agentic-phone]
  workflow_dispatch:
permissions:
  contents: read
# Keep an active independent build/verifier run alive against its pinned commit.
# GitHub retains one running and one pending run per group; newer pending work may replace older pending work.
concurrency:
  group: ci003-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/feat/phase1-agentic-phone' || (github.event_name == 'pull_request' && github.head_ref == 'feat/phase1-agentic-phone') || (github.event_name == 'pull_request' && github.base_ref == 'feat/phase1-agentic-phone' && (github.head_ref == 'feat/qa-stack007-exact-head-ci-20261111' || github.head_ref == 'feat/qa-stack008-ux-memoryvault-combined-20261111') && github.event.pull_request.head.repo.full_name == 'Davidcarmelalex/MrNothing-OS') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/qa-stack024-ci003-qa005-head-20261112' && github.repository == 'Davidcarmelalex/MrNothing-OS')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        builder: [runner-a, runner-b]
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert checked-out source is the exact event head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          cache: gradle
          cache-path: |
            ~/.gradle/caches
            ~/.gradle/distributions
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install pinned Android SDK platform and build tools
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed > "$RUNNER_TEMP/ci003-sdk-packages.txt"
          dpkg-query -W -f='${db:Status-Abbrev}\t${binary:Package}\t${Version}\n' > "$RUNNER_TEMP/ci003-dpkg-packages.tsv"
          cat /etc/os-release > "$RUNNER_TEMP/ci003-os-release.txt"
          python3 -m pip list --format=json > "$RUNNER_TEMP/ci003-python-packages.json"
          python3 --version > "$RUNNER_TEMP/ci003-python-version.txt"
          java -version 2>&1 | head -n 1 | tr -d '"' > "$RUNNER_TEMP/ci003-jdk-version.txt"
          java -XshowSettings:properties -version > "$RUNNER_TEMP/ci003-java-properties.txt" 2>&1
      - name: Download and checksum-verify Gradle 8.9
        run: |
          set -euo pipefail
          bash ../scripts/download_gradle_distribution.sh 8.9 "$HOME/.gradle/distributions/gradle-8.9-bin.zip"
          unzip -q "$HOME/.gradle/distributions/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --version > "$RUNNER_TEMP/ci003-gradle-version.txt"
      - name: Run release unit tests and build unsigned release APK
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon --no-build-cache --dependency-verification=strict :app:testReleaseUnitTest :app:assembleRelease :app:writeReleaseRuntimeInventory :app:writeReleaseVariantMetadata
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          test -f app/build/reports/ci003/release-runtime-dependencies.tsv
          test -s app/build/reports/ci003/release-variant-metadata.json

      - name: Verify Gradle-merged release manifest security
        run: |
          set -euo pipefail
          python3 ../scripts/release_manifest_gate.py --manifest-root app/build/intermediates --output app/build/reports/ci003/release-manifest-security.json
          test -s app/build/reports/ci003/release-manifest-security.json

      - name: Decode and verify packaged release APK manifest
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          CMDLINE_TOOLS_REVISION="$(awk -F= '$1 == "Pkg.Revision" {print $2; exit}' "$ANDROID_HOME/cmdline-tools/latest/source.properties")"
          test -s "$APK"
          test -x "$APKANALYZER"
          test -n "$CMDLINE_TOOLS_REVISION"
          DECODED="app/build/reports/ci003/release-packaged-manifest.xml"
          REPORT="app/build/reports/ci003/release-packaged-manifest-security.json"
          VARIANT_METADATA="app/build/reports/ci003/release-variant-metadata.json"
          "$APKANALYZER" manifest print "$APK" > "$DECODED"
          test -s "$DECODED"
          test -s "$VARIANT_METADATA"
          python3 ../scripts/apk_manifest_gate.py --merged-manifest-root app/build/intermediates --packaged-manifest "$DECODED" --variant-metadata "$VARIANT_METADATA" --decoder-revision "$CMDLINE_TOOLS_REVISION" --output "$REPORT"
          test -s "$REPORT"

      - name: Negative control — reject modified Gradle dependency
        run: python3 ../scripts/ci005_dependency_verification_negative.py "$RUNNER_TEMP/gradle-8.9/bin/gradle"
      - name: Generate deterministic SPDX runtime SBOM and build provenance
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          INVENTORY="app/build/reports/ci003/release-runtime-dependencies.tsv"
          VARIANT_METADATA="app/build/reports/ci003/release-variant-metadata.json"
          OUT="app/build/outputs/apk/release"
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$SOURCE_COMMIT")"
          JAVA_VERSION="$(java -version 2>&1 | head -n 1 | tr -d '"')"
          SDKMANAGER_VERSION="$(awk -F= '$1 == "Pkg.Revision" {print $2; exit}' "$ANDROID_HOME/cmdline-tools/latest/source.properties")"
          test -n "$SDKMANAGER_VERSION"
          printf "CI-003 toolchain: JDK=%s sdkmanager=%s\n" "$JAVA_VERSION" "$SDKMANAGER_VERSION"
          cp "$INVENTORY" "$OUT/release-runtime-dependencies.tsv"
          cp app/build/reports/ci003/release-manifest-security.json "$OUT/release-manifest-security.json"
          cp app/build/reports/ci003/release-packaged-manifest-security.json "$OUT/release-packaged-manifest-security.json"
          cp app/build/reports/ci003/release-variant-metadata.json "$OUT/release-variant-metadata.json"
          python3 ../scripts/ci003_artifacts.py sbom --inventory "$INVENTORY" --commit "$SOURCE_COMMIT" --app-version "0.1.0-dev" --created-epoch "$SOURCE_DATE_EPOCH" --output "$OUT/sbom.spdx.json"
          python3 ../scripts/ci003_artifacts.py provenance --apk "$APK" --sbom "$OUT/sbom.spdx.json" --commit "$SOURCE_COMMIT" --created-epoch "$SOURCE_DATE_EPOCH" --release-variant-metadata "$VARIANT_METADATA" --output "$OUT/provenance.json" --operating-system "ubuntu-24.04" --jdk-distribution "Temurin" --jdk-version "$JAVA_VERSION" --gradle-version "8.9" --gradle-sha256 "d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab" --agp-version "8.7.3" --kotlin-version "2.0.21" --compile-sdk "35" --build-tools "35.0.0" --sdkmanager-version "$SDKMANAGER_VERSION"
          PYTHON_VERSION="$(cat "$RUNNER_TEMP/ci003-python-version.txt")"
          python3 ../scripts/build_environment_sbom.py generate \
            --commit "$SOURCE_COMMIT" \
            --created-epoch "$SOURCE_DATE_EPOCH" \
            --runner-label "ubuntu-24.04" \
            --runner-image-os "${ImageOS:?GitHub runner image OS metadata missing}" \
            --runner-image-version "${ImageVersion:?GitHub runner image version metadata missing}" \
            --jdk-version "$JAVA_VERSION" \
            --python-version "$PYTHON_VERSION" \
            --os-release-file "$RUNNER_TEMP/ci003-os-release.txt" \
            --dpkg-packages-file "$RUNNER_TEMP/ci003-dpkg-packages.tsv" \
            --python-packages-file "$RUNNER_TEMP/ci003-python-packages.json" \
            --sdk-packages-file "$RUNNER_TEMP/ci003-sdk-packages.txt" \
            --sdk-root "$ANDROID_HOME" \
            --gradle-zip "$HOME/.gradle/distributions/gradle-8.9-bin.zip" \
            --gradle-version-file "$RUNNER_TEMP/ci003-gradle-version.txt" \
            --java-properties-file "$RUNNER_TEMP/ci003-java-properties.txt" \
            --workflow-file ../.github/workflows/ci003-reproducibility.yml \
            --root-gradle-file build.gradle.kts \
            --app-gradle-file app/build.gradle.kts \
            --output-inventory "$OUT/build-environment.inventory.json" \
            --output-sbom "$OUT/build-environment.spdx.json"
          python3 ../scripts/build_environment_sbom.py attach \
            --inventory "$OUT/build-environment.inventory.json" \
            --sbom "$OUT/build-environment.spdx.json" \
            --provenance "$OUT/provenance.json" \
            --expected-commit "$SOURCE_COMMIT"
          python3 ../scripts/build_environment_sbom.py negative-control --workflow ../.github/workflows/ci003-reproducibility.yml
          sha256sum "$APK" "$OUT/sbom.spdx.json" "$OUT/provenance.json" "$OUT/release-manifest-security.json" "$OUT/release-packaged-manifest-security.json" "$OUT/release-variant-metadata.json" "$OUT/build-environment.inventory.json" "$OUT/build-environment.spdx.json" > "$OUT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci003-unsigned-release-${{ matrix.builder }}
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/release-runtime-dependencies.tsv
            android/app/build/outputs/apk/release/sbom.spdx.json
            android/app/build/outputs/apk/release/provenance.json
            android/app/build/outputs/apk/release/SHA256SUMS.txt
            android/app/build/outputs/apk/release/release-manifest-security.json
            android/app/build/outputs/apk/release/release-packaged-manifest-security.json
            android/app/build/outputs/apk/release/release-variant-metadata.json
            android/app/build/outputs/apk/release/build-environment.inventory.json
            android/app/build/outputs/apk/release/build-environment.spdx.json
          if-no-files-found: error
          retention-days: 7

  verify-independent-runners:
    if: github.ref == 'refs/heads/feat/phase1-agentic-phone' || (github.event_name == 'pull_request' && github.head_ref == 'feat/phase1-agentic-phone') || (github.event_name == 'pull_request' && github.base_ref == 'feat/phase1-agentic-phone' && (github.head_ref == 'feat/qa-stack007-exact-head-ci-20261111' || github.head_ref == 'feat/qa-stack008-ux-memoryvault-combined-20261111') && github.event.pull_request.head.repo.full_name == 'Davidcarmelalex/MrNothing-OS') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/qa-stack024-ci003-qa005-head-20261112' && github.repository == 'Davidcarmelalex/MrNothing-OS')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert checked-out source is the exact event head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci003-unsigned-release-runner-a
          path: runner-a
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci003-unsigned-release-runner-b
          path: runner-b
      - name: Verify unsigned APK, normalized contents, SBOM and toolchain equivalence
        run: |
          set -euo pipefail
          python3 scripts/ci003_artifacts.py verify --first runner-a --second runner-b --expected-commit "$(git rev-parse HEAD)" --output ci003-verification.json
          cmp runner-a/release-manifest-security.json runner-b/release-manifest-security.json
          cmp runner-a/release-packaged-manifest-security.json runner-b/release-packaged-manifest-security.json
          cmp runner-a/release-variant-metadata.json runner-b/release-variant-metadata.json
          python3 scripts/build_environment_sbom.py verify --first runner-a --second runner-b --expected-commit "$(git rev-parse HEAD)" --output build-environment-verification.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci003-independent-runner-verification
          path: |
            ci003-verification.json
            build-environment-verification.json
          if-no-files-found: warn
          retention-days: 7
