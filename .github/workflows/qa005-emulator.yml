name: QA-005 Android emulator smoke
# Run once per PR rather than duplicating expensive emulators on push + PR.
on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/qa005_emulator_smoke.sh'
      - '.github/workflows/qa005-emulator.yml'
      - 'tests/test_qa005_workflow_gate.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa005-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_SERIAL: emulator-5554
      QA005_OUTPUT: ${{ github.workspace }}/qa005-evidence
      QA005_APK: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK and emulator system image
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Build debug APK with checksum-verified Gradle
        working-directory: android
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/gradle-8.9-bin.zip" https://services.gradle.org/distributions/gradle-8.9-bin.zip
          echo "d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  $RUNNER_TEMP/gradle-8.9-bin.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon :app:assembleDebug
      - name: Start disposable x86_64 emulator with bounded waits
        run: |
          set -euo pipefail
          mkdir -p "$QA005_OUTPUT"
          if [ ! -e /dev/kvm ]; then
            echo "KVM unavailable: emulator cannot meet accelerated runtime gate" >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          # Select a known device profile explicitly. Without -d, avdmanager
          # can prompt for a hardware profile and leave no usable AVD.
          printf 'no\n' | avdmanager create avd --force -n mrnothing_qa005 -k "system-images;android-35;google_apis;x86_64" -d pixel
          emulator -list-avds | tee "$QA005_OUTPUT/avd-list.txt"
          if ! grep -Fxq mrnothing_qa005 "$QA005_OUTPUT/avd-list.txt"; then
            echo "AVD creation failed: mrnothing_qa005 missing; refusing 180-second ADB wait" >&2
            ls -la "$HOME/.android/avd" > "$QA005_OUTPUT/avd-directory.txt" 2>&1 || true
            exit 1
          fi
          nohup emulator -avd mrnothing_qa005 -accel on -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -memory 2048 -cores 2 > "$RUNNER_TEMP/qa005-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > "$QA005_OUTPUT/emulator-pid.txt"
          if ! timeout 180s adb -s "$ANDROID_SERIAL" wait-for-device; then
            echo "Emulator did not connect to ADB within 180 seconds" >&2
            exit 1
          fi
          for i in $(seq 1 120); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited before boot completed" >&2
              exit 1
            fi
            if [ "$(timeout 12s adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = 1 ]; then
              echo "Emulator boot completed"
              exit 0
            fi
            sleep 2
          done
          echo "Emulator boot timed out" >&2
          exit 1
      - name: Verify launcher runtime and recovery route
        run: bash scripts/qa005_emulator_smoke.sh
      - name: Capture emulator diagnostics
        if: always()
        run: |
          mkdir -p "$QA005_OUTPUT"
          cp "$RUNNER_TEMP/qa005-emulator.log" "$QA005_OUTPUT/emulator.log" 2>/dev/null || true
          timeout 15s adb devices -l > "$QA005_OUTPUT/adb-devices.txt" 2>&1 || true
          timeout 15s adb -s "$ANDROID_SERIAL" logcat -d -t 300 > "$QA005_OUTPUT/logcat-tail.txt" 2>&1 || true
          df -h > "$QA005_OUTPUT/disk.txt" || true
          free -h > "$QA005_OUTPUT/memory.txt" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa005-emulator-evidence-not-for-release
          path: qa005-evidence/
          if-no-files-found: warn
          retention-days: 7
