name: QA-005 Android emulator smoke
# Run once per PR rather than duplicating expensive emulators on push + PR.
on:
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'scripts/qa005_emulator_smoke.sh'
      - '.github/workflows/qa005-emulator.yml'
      - 'tests/test_qa005_workflow_gate.py'
      - 'scripts/qa006_*'
      - 'tests/test_qa006_large_text.py'
      - 'scripts/qa007_*'
      - 'tests/test_qa007_role_consent.py'
      - 'scripts/qa008_*'
      - 'tests/test_qa008_role_accept.py'
      - 'scripts/qa009_*'
      - 'tests/test_qa009_stock_recovery.py'
      - 'scripts/qa010_*'
      - 'tests/test_qa010_accessibility.py'
      - 'scripts/qa011_*'
      - 'tests/test_qa011_talkback_preflight.py'
      - 'scripts/qa012_*'
      - 'tests/test_qa012_semantics.py'
      - 'scripts/qa013_*'
      - 'tests/test_qa013_owner_enrollment.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa005-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  emulator-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_SERIAL: emulator-5554
      QA005_OUTPUT: ${{ github.workspace }}/qa005-evidence
      QA005_APK: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK and emulator system image
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Build debug APK with checksum-verified Gradle
        working-directory: android
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/gradle-8.9-bin.zip" https://services.gradle.org/distributions/gradle-8.9-bin.zip
          echo "d725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab  $RUNNER_TEMP/gradle-8.9-bin.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon :app:assembleDebug
      - name: Start disposable x86_64 emulator with bounded waits
        run: |
          set -euo pipefail
          mkdir -p "$QA005_OUTPUT"
          if [ ! -e /dev/kvm ]; then
            echo "KVM unavailable: emulator cannot meet accelerated runtime gate" >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          # Select a known device profile explicitly. Without -d, avdmanager
          # can prompt for a hardware profile and leave no usable AVD.
          # Runner context is unavailable in job-level env; export here instead.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/mrnothing-avds"
          export ANDROID_USER_HOME="$RUNNER_TEMP/mrnothing-android-user"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          # Pin the AVD directory: the SDK manager and emulator must agree
          # on the location rather than relying on differing runner defaults.
          printf 'no\n' | avdmanager create avd --force -n mrnothing_qa005 -k "system-images;android-35;google_apis;x86_64" -d pixel -p "$ANDROID_AVD_HOME/mrnothing_qa005.avd" 2>&1 | tee "$QA005_OUTPUT/avd-create.txt"
          avdmanager list avd > "$QA005_OUTPUT/avd-manager-list.txt" 2>&1 || true
          emulator -list-avds | tee "$QA005_OUTPUT/avd-list.txt"
          if ! grep -Fxq mrnothing_qa005 "$QA005_OUTPUT/avd-list.txt"; then
            echo "AVD creation failed: mrnothing_qa005 missing; refusing 180-second ADB wait" >&2
            { printf 'ANDROID_AVD_HOME=%s\nANDROID_USER_HOME=%s\n' "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"; find "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$HOME/.android" -maxdepth 4 -type f -name '*.ini' -o -name 'config.ini' 2>/dev/null || true; } > "$QA005_OUTPUT/avd-directory.txt"
            exit 1
          fi
          nohup emulator -avd mrnothing_qa005 -accel on -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -memory 2048 -cores 2 > "$RUNNER_TEMP/qa005-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > "$QA005_OUTPUT/emulator-pid.txt"
          if ! timeout 180s adb -s "$ANDROID_SERIAL" wait-for-device; then
            echo "Emulator did not connect to ADB within 180 seconds" >&2
            exit 1
          fi
          for i in $(seq 1 120); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited before boot completed" >&2
              exit 1
            fi
            if [ "$(timeout 12s adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = 1 ]; then
              echo "Emulator boot completed"
              exit 0
            fi
            sleep 2
          done
          echo "Emulator boot timed out" >&2
          exit 1
      - name: Verify launcher runtime and recovery route
        run: bash scripts/qa005_emulator_smoke.sh
      - name: "QA-006: 200% font and recovery smoke"
        env:
          QA006_OUTPUT: ${{ github.workspace }}/qa005-evidence/qa006
        run: bash scripts/qa006_large_text_smoke.sh
      - name: "QA-007: HOME consent cancellation smoke"
        env:
          QA007_OUTPUT: ${{ github.workspace }}/qa005-evidence/qa007
        run: bash scripts/qa007_role_consent_smoke.sh
      - name: "QA-008: explicit HOME consent and recovery route"
        env:
          QA008_OUTPUT: ${{ github.workspace }}/qa005-evidence/qa008
        run: bash scripts/qa008_role_accept_smoke.sh
      - name: "QA-009: restore stock launcher through system UI"
        env:
          QA008_OUTPUT: ${{ github.workspace }}/qa005-evidence/qa008
          QA009_OUTPUT: ${{ github.workspace }}/qa005-evidence/qa009
        run: bash scripts/qa009_stock_recovery_smoke.sh
      - name: "QA-010: keyboard focus and accessible recovery"
        env:
          QA010_OUTPUT: ${{ github.workspace }}/qa005-evidence/qa010
        run: bash scripts/qa010_keyboard_navigation_smoke.sh
      - name: "QA-011: read-only TalkBack availability (NOT acceptance)"
        env:
          QA011_OUTPUT: ${{ github.workspace }}/qa005-evidence/qa011
        run: bash scripts/qa011_talkback_preflight.sh
      - name: "QA-012: read-only accessibility semantics (NOT TalkBack speech)"
        env:
          QA012_OUTPUT: qa005-evidence/qa012
        run: bash scripts/qa012_semantics_smoke.sh
      - name: "QA-013: deny insecure owner-key enrollment"
        env:
          QA013_OUTPUT: qa005-evidence/qa013
        run: bash scripts/qa013_owner_enrollment_smoke.sh
      - name: Capture emulator diagnostics
        if: always()
        run: |
          mkdir -p "$QA005_OUTPUT"
          cp "$RUNNER_TEMP/qa005-emulator.log" "$QA005_OUTPUT/emulator.log" 2>/dev/null || true
          timeout 15s adb devices -l > "$QA005_OUTPUT/adb-devices.txt" 2>&1 || true
          timeout 15s adb -s "$ANDROID_SERIAL" logcat -d -t 300 > "$QA005_OUTPUT/logcat-tail.txt" 2>&1 || true
          df -h > "$QA005_OUTPUT/disk.txt" || true
          free -h > "$QA005_OUTPUT/memory.txt" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qa005-emulator-evidence-not-for-release
          path: qa005-evidence/
          if-no-files-found: warn
          retention-days: 7
