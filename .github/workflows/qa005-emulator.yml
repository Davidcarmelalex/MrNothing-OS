name: QA-005 Android emulator smoke
# Run once per PR rather than duplicating expensive emulators on push + PR.
on:
  pull_request:
    branches: [main, feat/phase1-agentic-phone]
    paths:
      - 'android/**'
      - 'scripts/qa005_emulator_smoke.sh'
      - '.github/workflows/qa005-emulator.yml'
      - 'tests/test_qa005_workflow_gate.py'
      - 'scripts/qa006_*'
      - 'tests/test_qa006_large_text.py'
      - 'scripts/qa007_*'
      - 'tests/test_qa007_role_consent.py'
      - 'scripts/qa008_*'
      - 'tests/test_qa008_role_accept.py'
      - 'scripts/qa009_*'
      - 'tests/test_qa009_stock_recovery.py'
      - 'scripts/qa010_*'
      - 'tests/test_qa010_accessibility.py'
      - 'scripts/qa011_*'
      - 'tests/test_qa011_talkback_preflight.py'
      - 'scripts/qa012_*'
      - 'tests/test_qa012_semantics.py'
      - 'scripts/qa013_*'
      - 'tests/test_qa013_owner_enrollment.py'
      - 'scripts/qa020b2_*'
      - 'tests/test_qa020b2_*'
      - 'scripts/qa0203_*'
      - 'scripts/qa_ux008_*'
      - 'tests/test_qa_ux008_*'
      - 'scripts/qa_stack011_*'
      - 'tests/test_qa_stack011_*'
      - 'tests/test_qa0203_*'
      - 'android/app/src/debug/**'
  workflow_dispatch:
permissions:
  contents: read
# Let an active emulator run finish its EXIT cleanup, including disposable PIN removal.
# GitHub retains one running and at most one pending run per concurrency group.
concurrency:
  group: qa005-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  emulator-smoke:
    # Main-target PRs retain their existing gate; development-target PRs run only for this audited candidate.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/ux-agent006-rehearsal-mode-isolation-20261111' && github.repository == 'Davidcarmelalex/MrNothing-OS') || github.base_ref == 'main' || (github.base_ref == 'feat/phase1-agentic-phone' && (github.head_ref == 'feat/qa-stack007-exact-head-ci-20261111' || github.head_ref == 'feat/qa-ux008-agent-rehearsal-emulator-20261111' || github.head_ref == 'feat/qa-stack008-ux-memoryvault-combined-20261111') && github.event.pull_request.head.repo.full_name == 'Davidcarmelalex/MrNothing-OS') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/qa-stack024-ci003-qa005-head-20261112' && github.repository == 'Davidcarmelalex/MrNothing-OS') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/feat/qa-stack035-exact-head-emulator-repro-20261112' && github.repository == 'Davidcarmelalex/MrNothing-OS')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ANDROID_SERIAL: emulator-5554
      QA005_OUTPUT: ${{ github.workspace }}/qa005-evidence
      QA005_APK: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert checked-out source is the exact event head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17.0.21+9'
          cache: gradle
          cache-path: |
            ~/.gradle/caches
            ~/.gradle/distributions
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install SDK and emulator system image
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Build debug APK with checksum-verified Gradle
        working-directory: android
        run: |
          set -euo pipefail
          bash ../scripts/download_gradle_distribution.sh 8.9 "$HOME/.gradle/distributions/gradle-8.9-bin.zip"
          unzip -q "$HOME/.gradle/distributions/gradle-8.9-bin.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon --dependency-verification=strict :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Negative control — reject modified Gradle dependency
        run: python3 scripts/ci005_dependency_verification_negative.py "$RUNNER_TEMP/gradle-8.9/bin/gradle"
      - name: Start disposable x86_64 emulator with bounded waits
        run: |
          set -euo pipefail
          mkdir -p "$QA005_OUTPUT"
          if [ ! -e /dev/kvm ]; then
            echo "KVM unavailable: emulator cannot meet accelerated runtime gate" >&2
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          # Select a known device profile explicitly. Without -d, avdmanager
          # can prompt for a hardware profile and leave no usable AVD.
          # Runner context is unavailable in job-level env; export here instead.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/mrnothing-avds"
          export ANDROID_USER_HOME="$RUNNER_TEMP/mrnothing-android-user"
          mkdir -p "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          # Pin the AVD directory: the SDK manager and emulator must agree
          # on the location rather than relying on differing runner defaults.
          printf 'no\n' | avdmanager create avd --force -n mrnothing_qa005 -k "system-images;android-35;google_apis;x86_64" -d pixel -p "$ANDROID_AVD_HOME/mrnothing_qa005.avd" 2>&1 | tee "$QA005_OUTPUT/avd-create.txt"
          avdmanager list avd > "$QA005_OUTPUT/avd-manager-list.txt" 2>&1 || true
          emulator -list-avds | tee "$QA005_OUTPUT/avd-list.txt"
          if ! grep -Fxq mrnothing_qa005 "$QA005_OUTPUT/avd-list.txt"; then
            echo "AVD creation failed: mrnothing_qa005 missing; refusing 180-second ADB wait" >&2
            { printf 'ANDROID_AVD_HOME=%s\nANDROID_USER_HOME=%s\n' "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"; find "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME" "$HOME/.android" -maxdepth 4 -type f -name '*.ini' -o -name 'config.ini' 2>/dev/null || true; } > "$QA005_OUTPUT/avd-directory.txt"
            exit 1
          fi
          nohup emulator -avd mrnothing_qa005 -accel on -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -memory 3072 -cores 4 > "$RUNNER_TEMP/qa005-emulator.log" 2>&1 &
          EMULATOR_PID=$!
          echo "$EMULATOR_PID" > "$QA005_OUTPUT/emulator-pid.txt"
          if ! timeout 180s adb -s "$ANDROID_SERIAL" wait-for-device; then
            echo "Emulator did not connect to ADB within 180 seconds" >&2
            exit 1
          fi
          for i in $(seq 1 120); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator process exited before boot completed" >&2
              exit 1
            fi
            if [ "$(timeout 12s adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = 1 ]; then
              echo "Emulator boot completed"
              exit 0
            fi
            sleep 2
          done
          echo "Emulator boot timed out" >&2
          exit 1
      - name: "QA-STACK-009: uncredentialed instrumentation before synthetic PIN"
        working-directory: android
        run: |
          set -euo pipefail
          # Keep launcher, accessibility and MemoryVault tests outside the
          # credential-protected lifecycle scenario. Never unlock Keyguard
          # or grant permissions to make these tests pass.
          UNLOCKED_CLASSES="tech.mrnothing.os.AccessibilityDisclosureActivityTest,tech.mrnothing.os.MemoryVaultManifestBoundaryTest,tech.mrnothing.os.AgentPlanPreviewActivityTest,tech.mrnothing.os.AndroidAtomicAuthorityRecordPersistenceTest,tech.mrnothing.os.AndroidAuthorityTrustCryptoFailureModeTest,tech.mrnothing.os.OwnerAuthorityTrustActivityLifecycleTest,tech.mrnothing.os.MemoryVaultKeySpecContractTest"
          timeout 180s "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon --dependency-verification=strict :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=$UNLOCKED_CLASSES"
          # The next connected test invocation replaces Gradle's XML output.
          # Preserve this first suite for the installed-manifest evidence gate.
          mkdir -p "$QA005_OUTPUT/uncredentialed-instrumentation"
          cp -a app/build/outputs/androidTest-results/connected/debug/. "$QA005_OUTPUT/uncredentialed-instrumentation/"
      - name: "SEC-020B4D: Activity destruction before/after trust commit claim"
        working-directory: android
        run: |
          set -euo pipefail
          TEST_PIN=2468
          PIN_CONFIGURED=0
          # A prior instrumentation test can leave the disposable AVD asleep;
          # keep its display interactive during the suite without unlocking it.
          ORIGINAL_STAY_ON="$(adb -s "$ANDROID_SERIAL" shell settings get global stay_on_while_plugged_in | tr -d '\r')"
          [[ "$ORIGINAL_STAY_ON" == null || "$ORIGINAL_STAY_ON" =~ ^[0-9]+$ ]] || {
            echo "Unrecognized original emulator stay-awake setting" >&2
            exit 1
          }
          cleanup() {
            local rc=$?
            trap - EXIT INT TERM
            if [[ "$PIN_CONFIGURED" == 1 ]]; then
              if [[ "$rc" -ne 0 ]]; then
                # Capture the disposable emulator before removing its synthetic PIN.
                # This is bounded, unprivileged ADB screencap; it never uses root.
                timeout 10s adb -s "$ANDROID_SERIAL" exec-out screencap -p \
                  > "$QA005_OUTPUT/credential-ui-pre-cleanup.png" 2> "$QA005_OUTPUT/credential-ui-screencap.stderr" || rm -f "$QA005_OUTPUT/credential-ui-pre-cleanup.png"
                if [[ ! -s "$QA005_OUTPUT/credential-ui-pre-cleanup.png" ]]; then
                  rm -f "$QA005_OUTPUT/credential-ui-pre-cleanup.png"
                fi
              fi
              if adb -s "$ANDROID_SERIAL" shell locksettings clear --old "$TEST_PIN"; then
                PIN_CONFIGURED=0
              else
                echo "Failed to clear SEC-020B4D disposable emulator PIN" >&2
                rc=1
              fi
            fi
            if [[ "$ORIGINAL_STAY_ON" == null ]]; then
              adb -s "$ANDROID_SERIAL" shell settings delete global stay_on_while_plugged_in || rc=1
            else
              adb -s "$ANDROID_SERIAL" shell settings put global stay_on_while_plugged_in "$ORIGINAL_STAY_ON" || rc=1
            fi
            exit "$rc"
          }
          trap cleanup EXIT INT TERM
          adb -s "$ANDROID_SERIAL" shell svc power stayon true
          stay_on="$(adb -s "$ANDROID_SERIAL" shell settings get global stay_on_while_plugged_in | tr -d '\r')"
          [[ "$stay_on" =~ ^[1-9][0-9]*$ ]] || { echo "Emulator stay-awake setting not enabled" >&2; exit 1; }
          shell_identity="$(adb -s "$ANDROID_SERIAL" shell id | tr -d '\r')"
          [[ "$shell_identity" == *"uid=2000(shell)"* ]] || {
            echo "Expected ordinary adb shell identity; refusing privileged execution" >&2
            exit 1
          }
          adb -s "$ANDROID_SERIAL" shell locksettings set-pin "$TEST_PIN" \
            > "$RUNNER_TEMP/sec020b4d-pin-set.txt" 2>&1
          PIN_CONFIGURED=1
          # The lifecycle test needs a secure, unlocked, interactive device.
          # A fresh AVD is already unlocked; do not force a lockscreen cycle or
          # synthesize a Keyguard dismissal just to reach that required state.
          timeout 10s adb -s "$ANDROID_SERIAL" shell settings put system screen_off_timeout 600000
          timeout 10s adb -s "$ANDROID_SERIAL" shell input keyevent KEYCODE_WAKEUP
          read_power_state() {
            timeout 10s adb -s "$ANDROID_SERIAL" shell dumpsys power | tr -d '\r'
          }
          screen_is_awake() {
            python3 ../scripts/qa005_power_state.py --min-wake-age-ms 1500 --quiet 2>/dev/null <<< "$1"
          }
          awake=0
          power_state=""
          for attempt in $(seq 1 20); do
            power_state="$(read_power_state || true)"
            printf '%s\n' "$power_state" > "$QA005_OUTPUT/power-state-before-instrumentation.txt"
            if screen_is_awake "$power_state"; then
              awake=1
              break
            fi
            sleep 1
          done
          if [[ "$awake" != 1 ]]; then
            python3 ../scripts/qa005_power_state.py --min-wake-age-ms 1500 <<< "$power_state" || true
            echo "Disposable emulator display did not reach a fully interactive awake state before instrumentation" >&2
            exit 1
          fi
          # A configured synthetic PIN can leave the disposable AVD on Keyguard.
          # The instrumentation test owns authentication: it verifies the exact
          # visible SystemUI PIN surface and enters only the known synthetic PIN.
          # Capture Keyguard state for diagnosis, but do not preempt that tested flow.
          timeout 10s adb -s "$ANDROID_SERIAL" shell dumpsys window policy \
            | tr -d '\r' > "$QA005_OUTPUT/keyguard-state-before-instrumentation.txt" || true
          echo "Display is interactive; instrumentation will verify the synthetic credential and use exact visible SystemUI PIN controls when Keyguard is locked"
          timeout 180s "$RUNNER_TEMP/gradle-8.9/bin/gradle" --no-daemon --dependency-verification=strict :app:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=tech.mrnothing.os.OwnerAuthorityTrustActivityCommitLifecycleTest"
      - name: "SEC-023B1A-QA: require executed installed-manifest instrumentation"
        working-directory: android
        run: |
          set -euo pipefail
          python3 ../scripts/qa023b1a_instrumentation_evidence.py \
            "$QA005_OUTPUT/uncredentialed-instrumentation" \
            --summary "$QA005_OUTPUT/memory-vault-instrumentation-summary.json"
      - name: "QA-STACK-011: require complete split instrumentation evidence"
        run: |
          set -euo pipefail
          python3 scripts/qa_stack011_instrumentation_evidence.py \
            "$QA005_OUTPUT/uncredentialed-instrumentation" \
            android/app/build/outputs/androidTest-results/connected/debug \
            --summary "$QA005_OUTPUT/split-instrumentation-summary.json"
      - name: Verify launcher runtime and recovery route
        run: bash scripts/qa005_emulator_smoke.sh
      - name: "QA-006: 200% font and recovery smoke"
        env:
          QA006_OUTPUT: ${{ github.workspace }}/qa005-evidence/qa006
        run: bash scripts/qa006_large_text_smoke.sh
      - name: "QA-007: HOME consent cancellation smoke"
        env:
          QA007_OUTPUT: ${{ github.workspace }}/qa005-evidence/qa007
        run: bash scripts/qa007_role_consent_smoke.sh
      - name: "QA-008: explicit HOME consent and recovery route"
        env:
          QA008_OUTPUT: ${{ github.workspace }}/qa005-evidence/qa008
        run: bash scripts/qa008_role_accept_smoke.sh
      - name: "QA-009: restore stock launcher through system UI"
        env:
          QA008_OUTPUT: ${{ github.workspace }}/qa005-evidence/qa008
          QA009_OUTPUT: ${{ github.workspace }}/qa005-evidence/qa009
        run: bash scripts/qa009_stock_recovery_smoke.sh
      - name: "QA-010: keyboard focus and accessible recovery"
        env:
          QA010_OUTPUT: ${{ github.workspace }}/qa005-evidence/qa010
        run: bash scripts/qa010_keyboard_navigation_smoke.sh
      - name: "QA-011: read-only TalkBack availability (NOT acceptance)"
        env:
          QA011_OUTPUT: ${{ github.workspace }}/qa005-evidence/qa011
        run: bash scripts/qa011_talkback_preflight.sh
      - name: "QA-012: read-only accessibility semantics (NOT TalkBack speech)"
        env:
          QA012_OUTPUT: qa005-evidence/qa012
        run: bash scripts/qa012_semantics_smoke.sh
      - name: "QA-013: deny insecure owner-key enrollment"
        env:
          QA013_OUTPUT: qa005-evidence/qa013
        run: bash scripts/qa013_owner_enrollment_smoke.sh
      - name: "QA-020B2: owner authority trust UI runtime (emulator only)"
        env:
          QA020B2_OUTPUT: ${{ github.workspace }}/qa005-evidence/qa020b2
        run: bash scripts/qa020b2_authority_trust_smoke.sh
      - name: "QA-020B3: credential-only platform prompt (debug probe, emulator only)"
        env:
          QA020B3_OUTPUT: ${{ github.workspace }}/qa005-evidence/qa020b3
        run: bash scripts/qa0203_credential_prompt_smoke.sh
      - name: "QA-UX-008: offline agent rehearsal and 200% accessible UI"
        env:
          QAUX008_OUTPUT: ${{ github.workspace }}/qa005-evidence/qa-ux008
        run: bash scripts/qa_ux008_agent_plan_smoke.sh
      - name: Capture emulator diagnostics
        if: always()
        run: |
          mkdir -p "$QA005_OUTPUT"
          cp "$RUNNER_TEMP/qa005-emulator.log" "$QA005_OUTPUT/emulator.log" 2>/dev/null || true
          timeout 15s adb devices -l > "$QA005_OUTPUT/adb-devices.txt" 2>&1 || true
          for report in \
            android/app/build/reports/androidTests/connected/debug \
            android/app/build/outputs/androidTest-results/connected/debug; do
            if [ -d "$report" ]; then
              name="$(basename "$(dirname "$report")")-$(basename "$report")"
              mkdir -p "$QA005_OUTPUT/android-test-report/$name"
              cp -R "$report/." "$QA005_OUTPUT/android-test-report/$name/"
            fi
          done
          timeout 15s adb -s "$ANDROID_SERIAL" logcat -b all -d -t 2000 > "$QA005_OUTPUT/logcat-tail.txt" 2>&1 || true
          # Preserve process-start/exit events separately; lastanr can omit startup ANRs.
          timeout 15s adb -s "$ANDROID_SERIAL" logcat -b events -d -t 10000 > "$QA005_OUTPUT/events-tail.txt" 2>&1 || true
          timeout 15s adb -s "$ANDROID_SERIAL" shell dumpsys power > "$QA005_OUTPUT/power-state-after-instrumentation.txt" 2>&1 || true
          timeout 15s adb -s "$ANDROID_SERIAL" shell dumpsys activity exit-info tech.mrnothing.os > "$QA005_OUTPUT/app-exit-info.txt" 2>&1 || true
          timeout 15s adb -s "$ANDROID_SERIAL" shell dumpsys activity exit-info tech.mrnothing.os.test > "$QA005_OUTPUT/test-exit-info.txt" 2>&1 || true
          timeout 15s adb -s "$ANDROID_SERIAL" shell dumpsys activity lastanr > "$QA005_OUTPUT/last-anr.txt" 2>&1 || true
          # Startup ANRs can be absent from lastanr/exit-info; DropBox may retain the app ANR trace.
          timeout 15s adb -s "$ANDROID_SERIAL" shell dumpsys dropbox --print data_app_anr > "$QA005_OUTPUT/dropbox-data-app-anr.txt" 2>&1 || true
          timeout 15s adb -s "$ANDROID_SERIAL" shell dumpsys meminfo tech.mrnothing.os > "$QA005_OUTPUT/app-meminfo.txt" 2>&1 || true
          df -h > "$QA005_OUTPUT/disk.txt" || true
          free -h > "$QA005_OUTPUT/memory.txt" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: qa005-emulator-evidence-not-for-release
          path: qa005-evidence/
          if-no-files-found: warn
          retention-days: 7
